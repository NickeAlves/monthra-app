include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/generated/**
    - android/**
    - ios/**
    - web/**

linter:
  rules:
    # An app, not a published package: doc comments where they help, not on every member.
    public_member_api_docs: false

# Riverpod's lints and assists (an analysis_server_plugin, fetched by the
# analyzer; flutter analyze reports them too).
plugins:
  riverpod_lint: 3.2.0
