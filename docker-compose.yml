# Local environment: the web build served by nginx on http://localhost:3000,
# the origin the server's local .env allows. /api goes to the API through the
# shared network (monthra-api alias of monthra-server's compose).
# Requires the network once: make network  (docker network create monthra-net)
# For hot reload, run `make run-web` instead (flutter run, same port).
name: monthra-app

services:
  web:
    build:
      context: .
      target: runtime
      args:
        FLUTTER_ENV: ${FLUTTER_ENV:-local}
        VERSION: ${IMAGE_TAG:-local}
    image: ghcr.io/nickealves/monthra-app:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    networks:
      - monthra-net

networks:
  monthra-net:
    external: true
