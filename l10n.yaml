# flutter gen-l10n (also run by `flutter run/build/test`, `generate: true`).
# One ARB per language (§7.6); the app declares the full locales (pt_BR,
# es_ES, en_US) and the generated delegate matches them by language. The
# generated classes are committed; CI fails when they are stale (make gen).
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-dir: lib/l10n/generated
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
required-resource-attributes: true
format: true
