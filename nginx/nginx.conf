# Monthra web app: serves the Flutter web build and proxies /api to the API
# on the monthra-net network, so the app always calls its own origin
# (SameSite=Strict cookies, CSP connect-src 'self', no CORS).
# Runs as the unprivileged nginx user on a read-only filesystem: every
# writable path is under /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # JSON access log for Loki. $uri leaves out the query string; the email
    # tokens travel in the URL fragment, which never reaches a server.
    log_format json escape=json
        '{"time":"$time_iso8601","service":"monthra-app","request_id":"$request_id",'
        '"remote_addr":"$remote_addr","method":"$request_method","uri":"$uri",'
        '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
        '"user_agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    # Same limit as the API (HTTP_MAX_BODY_BYTES).
    client_max_body_size 1m;

    # The build ships .gz next to every compressible file (see the Dockerfile);
    # index.html is left uncompressed so its nonce can be written in.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json application/wasm image/svg+xml font/otf font/ttf;

    # The CSP nonce is the request id: 128 random bits, new on every response.
    # nginx writes it into index.html (sub_filter) and flutter_bootstrap.js
    # hands it to the engine, which tags the styles and scripts it creates.
    # 'wasm-unsafe-eval' lets CanvasKit compile its WebAssembly; the engine
    # and its fallback fonts are served from here (--no-web-resources-cdn).
    # SVG images (favicon) get their own policy: inline styles, no scripts.
    map $uri $csp {
        ~*\.svg$ "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'";
        default  "default-src 'none'; script-src 'self' 'nonce-$request_id' 'wasm-unsafe-eval'; style-src 'self' 'nonce-$request_id'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; require-trusted-types-for 'script'; trusted-types flutter-js dart.deferred-loading";
    }

    # Behind the infra proxy (TLS), keep the scheme the browser used.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        absolute_redirect off;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # The API on monthra-net, resolved per request by Docker's DNS, so
        # nginx starts (and serves the app) while the API is still down.
        location ^~ /api/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $api monthra-api:8080;
            proxy_pass http://$api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
            # Exports stream for up to 5 minutes (the API's write deadline).
            proxy_buffering off;
            proxy_read_timeout 330s;
            proxy_send_timeout 60s;
        }

        # The app shell: never cached (no content hash before Flutter 3.50),
        # with a fresh nonce written in on every response.
        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            gzip_static off;
            sub_filter_once off;
            sub_filter "__CSP_NONCE__" $request_id;
        }

        # Files: served as they are, or a real 404 (a missing script must not
        # come back as the HTML shell). Revalidated through their ETag.
        location ~ \.[A-Za-z0-9]+$ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        # Every other path is a route of the app (/verify-email, /budgets, ...).
        location / {
            rewrite ^ /index.html last;
        }
    }
}
