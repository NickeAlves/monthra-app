name: monthra
description: Monthra personal finance app for web, Android and iOS.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.7
  # Exact version: CI installs it from here (flutter-version-file).
  flutter: 3.47.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_svg: ^2.4.0
  flutter_web_plugins:
    sdk: flutter
  intl: ^0.20.2
  riverpod_annotation: ^4.0.8
  shadcn_ui: ^0.59.0
  shared_preferences: ^2.5.6
  web: ^1.1.2

dev_dependencies:
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.10
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  # gen-l10n runs with `flutter run/build/test` (l10n.yaml).
  generate: true
  # `flutter run` without --flavor builds the dev flavor (local environment).
  default-flavor: dev
  # Only the files the app draws at runtime; the full brand pack stays in
  # assets/brand/ for the icon and splash generators.
  assets:
    - assets/brand/monthra-simbolo.svg
    - assets/brand/monthra-simbolo-branco.svg
    # Registered with the LicenseRegistry at boot.
    - assets/fonts/inter/OFL.txt
  # Inter 4.1, subset to Latin by scripts/subset-inter.sh (OFL 1.1).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
