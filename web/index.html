<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Replaced by `flutter build --base-href`; the app is served from the root. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Monthra: personal finance for expenses, income and investments.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F5F3">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141414">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Monthra">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png">

  <title>Monthra</title>
  <link rel="manifest" href="manifest.json">
  <!-- No inline styles or scripts: the CSP only allows files from this origin
       and the nonce nginx writes on the bootstrap script for each response. -->
  <link rel="stylesheet" href="splash.css">
</head>
<body>
  <!-- Painted by the browser before Flutter starts, in the system theme, so a
       dark device never flashes white. flutter_bootstrap.js removes it on the
       first frame. -->
  <div id="splash" aria-hidden="true">
    <picture>
      <source srcset="splash/symbol-dark.svg" media="(prefers-color-scheme: dark)">
      <img src="splash/symbol.svg" alt="" width="96" height="96">
    </picture>
  </div>
  <script src="flutter_bootstrap.js" nonce="__CSP_NONCE__" async></script>
</body>
</html>
